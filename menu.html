<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUBO - Menú Digital</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:'Montserrat',sans-serif;
  background:#050505;
  color:white;
  overflow:hidden;
}

.hero{
  min-height:100vh;
  background:
  linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.82)),
    url("kubo-fondo.jpg");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top, rgba(255,0,0,.35), transparent 35%),
    linear-gradient(rgba(255,0,0,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,0,0,.07) 1px, transparent 1px);
  background-size:auto, 38px 38px, 38px 38px;
}

.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:520px;
  padding:34px 24px;
  border:1px solid rgba(255,40,40,.7);
  border-radius:28px;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(8px);
  text-align:center;
  box-shadow:
    0 0 40px rgba(255,0,0,.28),
    inset 0 0 30px rgba(255,0,0,.08);
}

.logo{
  font-family:'Bebas Neue';
  font-size:96px;
  color:#ff2020;
  letter-spacing:6px;
  text-shadow:
    0 0 8px white,
    0 0 20px #ff2020,
    0 0 50px #ff2020;
}

.sub{
  font-family:'Bebas Neue';
  font-size:28px;
  letter-spacing:5px;
  margin-top:-12px;
}

.line{
  height:3px;
  width:80%;
  margin:22px auto;
  background:#ff2020;
  box-shadow:0 0 15px #ff2020, 0 0 35px #ff2020;
}

.phrase{
  font-size:11px;
  letter-spacing:3px;
  color:#ddd;
  margin-bottom:28px;
}

.btn{
  display:block;
  width:100%;
  padding:20px;
  margin:15px 0;
  border-radius:18px;
  border:1px solid rgba(255,40,40,.8);
  background:rgba(10,10,10,.88);
  color:white;
  text-decoration:none;
  font-family:'Bebas Neue';
  font-size:30px;
  letter-spacing:2px;
  transition:.25s;
  box-shadow:inset 0 0 18px rgba(255,0,0,.08);
}

.btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:
    0 0 18px #ff2020,
    0 0 35px rgba(255,0,0,.7);
}

.footer{
  margin-top:28px;
  font-size:11px;
  letter-spacing:3px;
  color:#aaa;
}

@media(max-width:600px){
  body{
    overflow:auto;
  }

  .hero{
    padding:18px;
  }

  .card{
    border-radius:22px;
  }
}
</style>
</head>

<body>

<div class="hero">
  <div class="card">

    <div class="logo">KUBO</div>
    <div class="sub">MENÚ DIGITAL</div>

    <div class="line"></div>

    <div class="phrase">
      COCINA • TRAGOS • FÚTBOL • AMIGOS
    </div>

    <a class="btn" href="index.html">🍔 COMIDAS</a>
    <a class="btn" href="bebidas1.html">🍹 CÓCTELES Y BEBIDAS</a>
    <a class="btn" href="bebidas2.html">🍺 CERVEZAS · VINOS · MEDIDAS</a>

    <div class="footer">
      KUBO BAR & COCINA
    </div>

  </div>
</div>

</body>
</html>
